<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Art Creator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Tailwind slate-900 */
        }
        .canvas-container {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 0.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            object-fit: contain;
            background-color: #1e293b;
        }
        /* Custom scrollbar for a sleeker look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-bottom-color: #3b82f6; /* blue-500 */
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen pb-12">

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 pt-8">
        <header class="mb-10 text-center md:text-left border-b border-slate-800 pb-6">
            <h1 class="text-4xl font-extrabold tracking-tight text-white flex items-center justify-center md:justify-start gap-3">
                <svg class="w-10 h-10 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
                Studio Art Creator
            </h1>
            <p class="mt-2 text-slate-400">Design high-quality, custom album covers for your tracks.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            
            <!-- Left Column: Controls -->
            <div class="lg:col-span-5 space-y-8">
                
                <!-- Text Details -->
                <div class="bg-slate-800/50 p-6 rounded-2xl border border-slate-700/50 backdrop-blur-sm shadow-lg">
                    <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                        Track Details
                    </h2>
                    <div class="space-y-4">
                        <div>
                            <label for="bandName" class="block text-sm font-medium text-slate-300 mb-1">Artist / Band Name</label>
                            <input type="text" id="bandName" value="THE RUSTY STRINGS" placeholder="Enter artist name" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                        </div>
                        <div>
                            <label for="songName" class="block text-sm font-medium text-slate-300 mb-1">Song Title</label>
                            <input type="text" id="songName" value="Midnight Highway" placeholder="Enter song title" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                        </div>
                    </div>
                </div>

                <!-- Image Sources -->
                <div class="bg-slate-800/50 p-6 rounded-2xl border border-slate-700/50 backdrop-blur-sm shadow-lg">
                    <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        Cover Art Image
                    </h2>
                    
                    <!-- Tabs -->
                    <div class="flex border-b border-slate-700 mb-5">
                        <button id="tabUpload" class="flex-1 py-2 text-sm font-medium text-blue-400 border-b-2 border-blue-500 transition-colors">Upload Photo</button>
                        <button id="tabAI" class="flex-1 py-2 text-sm font-medium text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition-colors">AI Generator</button>
                    </div>

                    <!-- Upload Section -->
                    <div id="sectionUpload" class="space-y-4 block">
                        <label class="block w-full cursor-pointer group">
                            <div class="border-2 border-dashed border-slate-600 rounded-xl p-8 text-center bg-slate-900 group-hover:border-blue-500 group-hover:bg-slate-800 transition-all">
                                <svg class="w-10 h-10 mx-auto text-slate-400 group-hover:text-blue-400 mb-3 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                                <span class="block text-sm font-medium text-slate-300">Tap to browse gallery</span>
                                <span class="block text-xs text-slate-500 mt-1">PNG, JPG, HEIC</span>
                            </div>
                            <input type="file" id="imageUpload" accept="image/*" class="hidden">
                        </label>
                    </div>

                    <!-- AI Generation Section -->
                    <div id="sectionAI" class="space-y-4 hidden">
                        <div>
                            <label for="aiPrompt" class="block text-sm font-medium text-slate-300 mb-1">Describe your album art</label>
                            <textarea id="aiPrompt" rows="3" placeholder="e.g., A lone acoustic guitar leaning against an old oak tree at sunset, highly detailed, moody lighting..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all resize-none"></textarea>
                        </div>
                        <button id="generateBtn" class="w-full bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg flex items-center justify-center gap-2 transition-all transform hover:scale-[1.02] active:scale-[0.98]">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                            <span id="generateText">Generate Artwork</span>
                            <div id="generateLoader" class="loader w-5 h-5 hidden"></div>
                        </button>
                        <p class="text-xs text-slate-500 text-center">Uses AI to generate a unique, high-quality image.</p>
                    </div>
                </div>
            </div>

            <!-- Right Column: Canvas Preview -->
            <div class="lg:col-span-7 flex flex-col items-center justify-start space-y-6">
                <div class="w-full bg-slate-800/50 p-6 rounded-2xl border border-slate-700/50 backdrop-blur-sm shadow-lg flex flex-col items-center">
                    <h2 class="text-xl font-bold mb-6 w-full text-center md:text-left flex items-center gap-2">
                        <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        Live Preview
                    </h2>
                    
                    <div class="canvas-container relative">
                        <canvas id="albumCanvas"></canvas>
                    </div>

                    <button id="downloadBtn" class="mt-8 w-full max-w-sm bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 px-6 rounded-xl shadow-lg shadow-emerald-900/50 flex items-center justify-center gap-3 transition-all transform hover:scale-[1.02] active:scale-[0.98]">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Download Album Art
                    </button>
                    <p class="text-xs text-slate-500 mt-3">Saves as a high-resolution PNG file.</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        // DOM Elements
        const canvas = document.getElementById('albumCanvas');
        const ctx = canvas.getContext('2d');
        const bandNameInput = document.getElementById('bandName');
        const songNameInput = document.getElementById('songName');
        const imageUploadInput = document.getElementById('imageUpload');
        const downloadBtn = document.getElementById('downloadBtn');
        
        // Tabs
        const tabUpload = document.getElementById('tabUpload');
        const tabAI = document.getElementById('tabAI');
        const sectionUpload = document.getElementById('sectionUpload');
        const sectionAI = document.getElementById('sectionAI');
        
        // AI Generation
        const aiPrompt = document.getElementById('aiPrompt');
        const generateBtn = document.getElementById('generateBtn');
        const generateText = document.getElementById('generateText');
        const generateLoader = document.getElementById('generateLoader');
        const toastContainer = document.getElementById('toastContainer');

        // State
        const CANVAS_SIZE = 1500; // High resolution for actual export
        canvas.width = CANVAS_SIZE;
        canvas.height = CANVAS_SIZE;
        let currentImage = null;

        // Custom Toast Notification (Replaces alerts)
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            const bgColor = type === 'error' ? 'bg-red-500' : 'bg-slate-800';
            const border = type === 'error' ? 'border-red-600' : 'border-slate-600';
            
            toast.className = `${bgColor} text-white px-6 py-3 rounded-lg shadow-xl border ${border} flex items-center gap-2 transform transition-all duration-300 translate-y-[-20px] opacity-0`;
            
            const icon = type === 'error' 
                ? `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`
                : `<svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
            
            toast.innerHTML = `${icon} <span>${message}</span>`;
            toastContainer.appendChild(toast);

            // Animate in
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-[-20px]', 'opacity-0');
            });

            // Remove after 3 seconds
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-20px]');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Initialize with a placeholder image
        const placeholderImg = new Image();
        placeholderImg.crossOrigin = "Anonymous";
        placeholderImg.onload = () => {
            currentImage = placeholderImg;
            drawCanvas();
        };
        // Generate a dark, textured placeholder
        placeholderImg.src = 'https://placehold.co/1500x1500/1e293b/334155?text=Upload+or+Generate+Image';


        // Tab Switching Logic
        tabUpload.addEventListener('click', () => {
            tabUpload.classList.add('text-blue-400', 'border-blue-500');
            tabUpload.classList.remove('text-slate-400', 'border-transparent');
            tabAI.classList.remove('text-blue-400', 'border-blue-500');
            tabAI.classList.add('text-slate-400', 'border-transparent');
            
            sectionUpload.classList.remove('hidden');
            sectionAI.classList.add('hidden');
        });

        tabAI.addEventListener('click', () => {
            tabAI.classList.add('text-blue-400', 'border-blue-500');
            tabAI.classList.remove('text-slate-400', 'border-transparent');
            tabUpload.classList.remove('text-blue-400', 'border-blue-500');
            tabUpload.classList.add('text-slate-400', 'border-transparent');
            
            sectionAI.classList.remove('hidden');
            sectionUpload.classList.add('hidden');
        });

        // Drawing Logic
        function drawCanvas() {
            // Clear Canvas
            ctx.fillStyle = '#111827';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // 1. Draw Image Background (cover logic)
            if (currentImage) {
                const scale = Math.max(CANVAS_SIZE / currentImage.width, CANVAS_SIZE / currentImage.height);
                const x = (CANVAS_SIZE / 2) - (currentImage.width / 2) * scale;
                const y = (CANVAS_SIZE / 2) - (currentImage.height / 2) * scale;
                ctx.drawImage(currentImage, x, y, currentImage.width * scale, currentImage.height * scale);
            }

            // 2. Add Gradient Overlay for Text Readability
            // Darker at the top and bottom, transparent in middle
            const gradient = ctx.createLinearGradient(0, 0, 0, CANVAS_SIZE);
            gradient.addColorStop(0, 'rgba(0,0,0,0.6)');
            gradient.addColorStop(0.3, 'rgba(0,0,0,0)');
            gradient.addColorStop(0.6, 'rgba(0,0,0,0)');
            gradient.addColorStop(1, 'rgba(0,0,0,0.85)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // 3. Draw Text
            const bandText = bandNameInput.value.trim().toUpperCase();
            const songText = songNameInput.value.trim();

            ctx.textAlign = 'center';
            
            // Text Shadows for extra pop
            ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
            ctx.shadowBlur = 20;
            ctx.shadowOffsetX = 4;
            ctx.shadowOffsetY = 4;

            // Draw Band Name (Top)
            if (bandText) {
                ctx.fillStyle = '#ffffff';
                ctx.font = '900 100px "Montserrat", sans-serif';
                // Handle long text scaling roughly
                const maxTextWidth = CANVAS_SIZE - 100;
                let fontSize = 100;
                ctx.font = `900 ${fontSize}px "Montserrat", sans-serif`;
                while(ctx.measureText(bandText).width > maxTextWidth && fontSize > 40) {
                    fontSize -= 5;
                    ctx.font = `900 ${fontSize}px "Montserrat", sans-serif`;
                }
                ctx.fillText(bandText, CANVAS_SIZE / 2, 180);
            }

            // Draw Song Name (Bottom)
            if (songText) {
                ctx.fillStyle = '#e2e8f0'; // slate-200
                ctx.font = 'italic 700 80px "Montserrat", sans-serif';
                // Handle long text scaling roughly
                const maxTextWidth = CANVAS_SIZE - 150;
                let fontSize = 80;
                ctx.font = `italic 700 ${fontSize}px "Montserrat", sans-serif`;
                while(ctx.measureText(songText).width > maxTextWidth && fontSize > 30) {
                    fontSize -= 5;
                    ctx.font = `italic 700 ${fontSize}px "Montserrat", sans-serif`;
                }
                ctx.fillText(songText, CANVAS_SIZE / 2, CANVAS_SIZE - 120);
            }
            
            // Reset shadow
            ctx.shadowColor = 'transparent';
        }

        // Event Listeners for real-time updates
        bandNameInput.addEventListener('input', drawCanvas);
        songNameInput.addEventListener('input', drawCanvas);

        // File Upload Handling
        imageUploadInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    currentImage = img;
                    drawCanvas();
                    showToast('Image loaded successfully');
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        // AI Generation Handling (Using Gemini API)
        generateBtn.addEventListener('click', async () => {
            const prompt = aiPrompt.value.trim();
            if (!prompt) {
                showToast('Please enter a description for the image', 'error');
                return;
            }

            // UI Loading State
            generateBtn.disabled = true;
            generateBtn.classList.add('opacity-75', 'cursor-not-allowed');
            generateText.textContent = 'Generating...';
            generateLoader.classList.remove('hidden');

            try {
                // Ensure API key is empty as per environment rules
                const apiKey = ""; 
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key=${apiKey}`;
                
                // Add specific styling to the prompt to make it good for album art
                const enhancedPrompt = `Album cover art, no text, ${prompt}, highly detailed, professional lighting, cinematic, square format`;

                const payload = {
                    contents: [{
                        role: 'user',
                        parts: [{ text: enhancedPrompt }]
                    }],
                    generationConfig: {
                        responseModalities: ['IMAGE'],
                        imageConfig: { aspectRatio: "1:1" }
                    },
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error('API Request Failed');
                }

                const result = await response.json();
                const part = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);

                if (part && part.inlineData && part.inlineData.data) {
                    const imageUrl = `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`;
                    const img = new Image();
                    img.onload = () => {
                        currentImage = img;
                        drawCanvas();
                        showToast('AI Image generated successfully!');
                    };
                    img.src = imageUrl;
                } else {
                    throw new Error('No image data found in response');
                }

            } catch (error) {
                console.error("Generation error:", error);
                showToast('Failed to generate image. Please try again.', 'error');
            } finally {
                // Restore UI State
                generateBtn.disabled = false;
                generateBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                generateText.textContent = 'Generate Artwork';
                generateLoader.classList.add('hidden');
            }
        });

        // Download Handling
        downloadBtn.addEventListener('click', () => {
            try {
                // Get data URL from canvas
                const dataUrl = canvas.toDataURL('image/png', 1.0);
                
                // Create temporary link and trigger download
                const link = document.createElement('a');
                // Format filename nicely
                const safeBand = bandNameInput.value.replace(/[^a-z0-9]/gi, '_').toLowerCase() || 'band';
                const safeSong = songNameInput.value.replace(/[^a-z0-9]/gi, '_').toLowerCase() || 'song';
                
                link.download = `${safeBand}_${safeSong}_cover.png`;
                link.href = dataUrl;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                showToast('Album art downloaded!');
            } catch (err) {
                console.error(err);
                showToast('Error downloading image', 'error');
            }
        });

        // Initial Draw
        document.fonts.ready.then(() => {
            drawCanvas();
        });

    </script>
</body>
</html>
